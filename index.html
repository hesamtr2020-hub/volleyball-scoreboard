<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Volleyball Scoreboard</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #111;
    touch-action: manipulation;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
}

.scoreboard {
    display: flex;
    width: 100vw;
    height: 100vh;
    position: relative;
}

.team {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    color: white;
}

.team-blue {
    background: #0057d9;
}

.team-red {
    background: #d90000;
}

.score {
    font-size: 190px;
    font-weight: bold;
    color: white;
    line-height: 1;
}

.buttons {
    display: flex;
    gap: 14px;
}

button {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    border: none;
    font-size: 24px;
    font-weight: bold;
    background: white;
    color: #111;
    cursor: pointer;
    touch-action: manipulation;
}

button:active {
    transform: scale(0.95);
}

.reset-btn {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    width: 110px;
    height: 42px;
    border-radius: 25px;
    font-size: 18px;
    z-index: 100;
}

/* Mobile Portrait */
@media (orientation: portrait) {
    .score {
        font-size: 170px;
    }
}

/* Mobile Landscape */
@media (orientation: landscape) and (max-height: 500px) {

    .score {
        font-size: 120px;
    }

    .team {
        gap: 8px;
    }

    button {
        width: 40px;
        height: 40px;
        font-size: 20px;
    }

    .reset-btn {
        width: 90px;
        height: 34px;
        font-size: 14px;
        top: 6px;
    }
}

/* Very Small Landscape Phones */
@media (orientation: landscape) and (max-height: 390px) {

    .score {
        font-size: 90px;
    }

    button {
        width: 36px;
        height: 36px;
        font-size: 18px;
    }

    .reset-btn {
        width: 80px;
        height: 30px;
        font-size: 12px;
    }
}
</style>
</head>

<body>

<!-- VERSION -->
<div style="
position: fixed;
bottom: 5px;
right: 5px;
color: white;
font-size: 12px;
opacity: 0.5;
z-index: 9999;">
v1.8
</div>

<div class="scoreboard">

    <button class="reset-btn" onclick="resetScores()">
        Reset
    </button>

    <div class="team team-blue">

        <div id="blueScore" class="score">00</div>

        <div class="buttons">
            <button onclick="changeScore('blue',-1)">−</button>
            <button onclick="changeScore('blue',1)">+</button>
        </div>

    </div>

    <div class="team team-red">

        <div id="redScore" class="score">00</div>

        <div class="buttons">
            <button onclick="changeScore('red',-1)">−</button>
            <button onclick="changeScore('red',1)">+</button>
        </div>

    </div>

</div>

<script>

console.log("VERSION 1.8");

let blue = 0;
let red = 0;

function formatScore(score) {
    return score.toString().padStart(2, "0");
}

function updateScores() {
    document.getElementById("blueScore").textContent = formatScore(blue);
    document.getElementById("redScore").textContent = formatScore(red);
}

function changeScore(team, amount) {

    if (team === "blue") {
        blue = Math.max(0, blue + amount);
    }

    if (team === "red") {
        red = Math.max(0, red + amount);
    }

    updateScores();
}

function resetScores() {
    blue = 0;
    red = 0;
    updateScores();
}

/* Prevent double-tap zoom on iPhone */
let lastTouchEnd = 0;

document.addEventListener('touchend', function (event) {
    const now = Date.now();

    if (now - lastTouchEnd <= 300) {
        event.preventDefault();
    }

    lastTouchEnd = now;
}, false);

</script>

</body>
</html>
